<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>html-docx-kit 浏览器示例</title>
<style>
  body { max-width: 820px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; color: #283446; }
  textarea { width: 100%; min-height: 340px; box-sizing: border-box; font: 14px/1.6 monospace; padding: 16px; border: 1px solid #bac8da; border-radius: 8px; }
  button { margin-top: 16px; padding: 12px 22px; background: #245da8; border: 0; border-radius: 6px; color: white; cursor: pointer; }
  #status { white-space: pre-wrap; }
</style>
<h1>HTML → DOCX</h1>
<p>输入 HTML，在本地生成可供 Microsoft Word 打开的文档。</p>
<label for="html">HTML 内容</label>
<textarea id="html"><!doctype html>
<html><head><meta charset="utf-8"><style>
body { font-family: Arial, sans-serif; }
h1 { color: #245da8; }
table { border-collapse: collapse; }
td, th { border: 1px solid #aaa; padding: 8px; }
</style></head><body>
<h1>项目报告</h1>
<p>你好，Word！这是从 HTML 导出的文档。</p>
<table><tr><th>功能</th><th>状态</th></tr>
<tr><td>中文和表格</td><td>支持</td></tr></table>
</body></html></textarea>
<button id="download" type="button">下载 DOCX</button>
<p id="status" role="status"></p>
<script src="../dist/html-docx-kit.global.js"></script>
<script>
  document.getElementById('download').addEventListener('click', () => {
    const status = document.getElementById('status');
    try {
      const blob = htmlDocx.asBlob(document.getElementById('html').value, { pageSize: 'A4' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'report.docx';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      status.textContent = `已生成 ${blob.size} 字节的 DOCX。请用 Word 打开。`;
    } catch (error) {
      status.textContent = error.message;
    }
  });
</script>
</html>
